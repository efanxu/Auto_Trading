[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-trading-event-research"
version = "0.1.0"
description = "Shared foundation for BTC probability and Event Contract research"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
