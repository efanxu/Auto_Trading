project:
  seed: 2026

data:
  source: binance_public_data
  market: usd_m_futures
  series: index_price_klines
  symbol: BTCUSDT
  intervals:
    fine: 5m
    coarse: 30m
  interval: 30m
  timezone: UTC
  start_date: 2020-01-01
  end_date: 2026-08-31

target:
  type: binary_direction
  horizon_minutes: 30
  entry_price: next_bar_open
  expiry_price: next_bar_close

split:
  method: chronological
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  purge_minutes: 30

prediction:
  frequency_minutes: 30

calibration:
  method: none

signal:
  long_probability_threshold: null
  short_probability_threshold: null
  cooldown_minutes: null
  rearm_probability_threshold: null

features:
  set: price_multires_v1
  fine_interval: 5m
  coarse_interval: 30m
  fine_max_lookback_bars: 288
  coarse_max_lookback_bars: 48
  max_lag_bars: 48
  require_contiguous_history: true

training:
  early_stopping:
    enabled: true
    internal_fraction: 0.10
    purge_minutes: 30
    stopping_rounds: 100
    metric: binary_logloss

event:
  horizon_minutes: 30
  stake_usdt: 10.0
  winning_total_return_usdt: 18.5
